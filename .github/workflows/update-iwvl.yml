name: Update IWVL Dashboard Data

on:
  schedule:
    - cron: '37 5 * * 1-5'    # 05:37 UTC (06:37/07:37 Roma) - dati con chiusura precedente
    - cron: '50 16 * * 1-5'   # 16:50 UTC (17:50/18:50 Roma) - dopo chiusura Borsa Italiana
  workflow_dispatch:           # Esecuzione manuale da GitHub

permissions:
  contents: write

concurrency:
  group: update-iwvl
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: python iwvl_fetch.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iwvl.json data/charts regole
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "Auto-update IWVL [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
